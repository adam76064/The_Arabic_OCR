name: Build and Release (Cross-Platform)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (e.g. v0.1.0-exp)'
        required: true
        default: 'v0.1.0-exp'
      is_prerelease:
        description: 'Mark as experimental / pre-release'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x64 Executable
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Generate macOS ICNS Icon
        run: |
          mkdir -p AppIcon.iconset
          SRC="packaging/linux/thearabicocr.png"
          
          # Explicitly create all mandatory macOS icon dimensions including 1024x1024 (@2x)
          sips -z 16 16 "$SRC" --out AppIcon.iconset/icon_16x16.png >/dev/null
          sips -z 32 32 "$SRC" --out AppIcon.iconset/icon_16x16@2x.png >/dev/null
          sips -z 32 32 "$SRC" --out AppIcon.iconset/icon_32x32.png >/dev/null
          sips -z 64 64 "$SRC" --out AppIcon.iconset/icon_32x32@2x.png >/dev/null
          sips -z 128 128 "$SRC" --out AppIcon.iconset/icon_128x128.png >/dev/null
          sips -z 256 256 "$SRC" --out AppIcon.iconset/icon_128x128@2x.png >/dev/null
          sips -z 256 256 "$SRC" --out AppIcon.iconset/icon_256x256.png >/dev/null
          sips -z 512 512 "$SRC" --out AppIcon.iconset/icon_256x256@2x.png >/dev/null
          sips -z 512 512 "$SRC" --out AppIcon.iconset/icon_512x512.png >/dev/null
          sips -z 1024 1024 "$SRC" --out AppIcon.iconset/icon_512x512@2x.png >/dev/null
          
          mkdir -p packaging/macos
          iconutil -c icns AppIcon.iconset -o packaging/macos/TheArabicOCR.icns
          rm -rf AppIcon.iconset
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install pyinstaller pythonnet clr_loader

      - name: Compile application with PyInstaller
        run: |
          pyinstaller TheArabicOCR.spec --noconfirm

      - name: Package release ZIP
        shell: pwsh
        run: |
          if (Test-Path dist/TheArabicOCR/_internal/python3*.dll) {
            Copy-Item dist/TheArabicOCR/_internal/python3*.dll -Destination dist/TheArabicOCR/ -Force
          }
          Compress-Archive -Path dist/TheArabicOCR/* -DestinationPath dist/TheArabicOCR-Windows-x64.zip -Force

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TheArabicOCR-Windows-x64
          path: dist/TheArabicOCR-Windows-x64.zip
          if-no-files-found: error

  build-linux:
    name: Build Linux x86_64 AppImage
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            gir1.2-webkit2-4.1 \
            libgirepository1.0-dev \
            libcairo2-dev \
            poppler-utils \
            libgl1 \
            libglib2.0-0 \
            file \
            curl

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install pyinstaller PyQt5 PyQtWebEngine
          pip install "PyGObject<3.48.0" || true

      - name: Compile application with PyInstaller
        run: |
          pyinstaller TheArabicOCR.spec --noconfirm
          chmod +x dist/TheArabicOCR/TheArabicOCR

      - name: Assemble AppDir
        run: |
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/512x512/apps

          # Copy compiled PyInstaller distribution
          cp -r dist/TheArabicOCR/* AppDir/usr/bin/

          # Copy desktop file and icons
          cp packaging/linux/AppRun AppDir/AppRun
          chmod +x AppDir/AppRun

          cp packaging/linux/TheArabicOCR.desktop AppDir/TheArabicOCR.desktop
          cp packaging/linux/TheArabicOCR.desktop AppDir/usr/share/applications/TheArabicOCR.desktop

          cp packaging/linux/thearabicocr.png AppDir/thearabicocr.png
          cp packaging/linux/thearabicocr.png AppDir/usr/share/icons/hicolor/512x512/apps/thearabicocr.png
          ln -sf thearabicocr.png AppDir/.DirIcon

      - name: Build AppImage via appimagetool
        run: |
          curl -L -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ./appimagetool --appimage-extract
          ARCH=x86_64 ./squashfs-root/AppRun AppDir TheArabicOCR-Linux-x86_64.AppImage
          chmod +x TheArabicOCR-Linux-x86_64.AppImage

      - name: Upload Linux AppImage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TheArabicOCR-Linux-x86_64
          path: TheArabicOCR-Linux-x86_64.AppImage
          if-no-files-found: error

  build-macos:
    name: Build macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel   # Intel Macs (x86_64)
            arch: x86_64
          - runner: macos-14         # Apple Silicon (arm64)
            arch: arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies (without scantailor)
        run: |
            python -m pip install --upgrade pip wheel "setuptools<81"
            grep -vi scantailor requirements.txt > requirements-macos.txt
            pip install -r requirements-macos.txt
            pip install --upgrade pyinstaller pyinstaller-hooks-contrib
            pip install "setuptools<81"

      # PyPI has no macOS wheels for scantailor-advanced, so compile it against
      # Homebrew Qt5 + Boost. If this fails, the app still works (it falls back
      # to OpenCV-based preprocessing when `stalib` is missing).
      - name: Build scantailor-advanced (stalib) from source
        id: stalib
        continue-on-error: true
        run: |
          if [ -x packaging/macos/build_stalib.sh ]; then
            packaging/macos/build_stalib.sh
          else
            echo "build_stalib.sh not present or not executable; skipping or using fallback"
          fi

      - name: Create .icns app icon
        shell: bash
        run: |
          set -euo pipefail

          SRC="packaging/linux/thearabicocr.png"
          ICONSET="AppIcon.iconset"
          OUTPUT="packaging/macos/TheArabicOCR.icns"

          test -f "$SRC" || {
            echo "Icon source not found: $SRC"
            exit 1
          }

          rm -rf "$ICONSET"
          mkdir -p "$ICONSET"
          mkdir -p "$(dirname "$OUTPUT")"

          # macOS iconutil-compatible iconset sizes (standard base sizes and @2x retina)
          for size in 16 32 128 256 512; do
            retina=$((size * 2))

            sips -s format png -z "$size" "$size" "$SRC" \
              --out "$ICONSET/icon_${size}x${size}.png" >/dev/null

            sips -s format png -z "$retina" "$retina" "$SRC" \
              --out "$ICONSET/icon_${size}x${size}@2x.png" >/dev/null
          done

          iconutil -c icns "$ICONSET" -o "$OUTPUT"
          test -s "$OUTPUT"
          rm -rf "$ICONSET"

      - name: Compile application with PyInstaller
        run: |
          pyinstaller TheArabicOCR.spec --noconfirm
          ls -la dist
          lipo -archs dist/TheArabicOCR.app/Contents/MacOS/TheArabicOCR

      - name: Ad-hoc sign and package ZIP
        run: |
          codesign --force --deep --sign - dist/TheArabicOCR.app || echo "codesign warning (continuing)"
          ditto -c -k --sequesterRsrc --keepParent dist/TheArabicOCR.app dist/TheArabicOCR-macOS-${{ matrix.arch }}.zip

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TheArabicOCR-macOS-${{ matrix.arch }}
          path: dist/TheArabicOCR-macOS-${{ matrix.arch }}.zip
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Determine Release Tag
        id: release_info
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          elif [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            TAG="v0.1.0-exp"
          fi
          echo "TAG_NAME=$TAG" >> $GITHUB_OUTPUT

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.TAG_NAME }}
          name: The Arabic OCR ${{ steps.release_info.outputs.TAG_NAME }} (Cross-Platform)
          draft: false
          prerelease: ${{ github.event.inputs.is_prerelease != false }}
          files: |
            release-artifacts/TheArabicOCR-Windows-x64.zip
            release-artifacts/TheArabicOCR-Linux-x86_64.AppImage
            release-artifacts/TheArabicOCR-macOS-x86_64.zip
            release-artifacts/TheArabicOCR-macOS-arm64.zip
          body: |
            # 📖 The Arabic OCR - Release (${{ steps.release_info.outputs.TAG_NAME }})

            Cross-platform desktop release of **The Arabic OCR** for Windows (x64), Linux (x86_64), and macOS (Intel + Apple Silicon).

            ---

            ### ✨ Key Features:
            - **ScanTailor Advanced Pre-Processing Studio:** Orientation correction, page splitting, deskewing, content selection, margins, and binarization.
            - **Multi-Engine OCR:** PaddleOCR, Google Lens, Locro Offline (ScreenAI), and LLM Vision (Gemini, Claude, GPT-4o).
            - **Review Studio:** Side-by-side text block editing, table extraction, classical and modern poetry formatting, and Uthmani Quran verification.
            - **Post-Processing:** Arabic reading order auto-sorting and pagination detection.
            - **Multi-Format Export:** Word (DOCX), EPUB3, HTML, TXT, and JSON.
            - **Modern Multilingual UI:** Full light/dark themes with customizable color palettes (Arabic, English, German).

            ---

            ### 📦 Download & Running Instructions:

            #### 🪟 Windows (64-bit):
            1. Download `TheArabicOCR-Windows-x64.zip`.
            2. Extract the archive to any folder on your computer.
            3. Run `TheArabicOCR.exe` inside the extracted folder.

            #### 🐧 Linux (AppImage x86_64):
            1. Download `TheArabicOCR-Linux-x86_64.AppImage`.
            2. Make the file executable:
               ```bash
               chmod +x TheArabicOCR-Linux-x86_64.AppImage
               ```
            3. Run directly:
               ```bash
               ./TheArabicOCR-Linux-x86_64.AppImage
               ```
               *(Compatible with Ubuntu, Debian, Fedora, Arch Linux, Linux Mint, and others. No installation required).*

            #### 🍎 macOS:
            1. Download the build for your Mac:
               - `TheArabicOCR-macOS-arm64.zip` — Apple Silicon (M1/M2/M3/M4)
               - `TheArabicOCR-macOS-x86_64.zip` — Intel Macs
            2. Unzip and move `TheArabicOCR.app` to Applications.
            3. The app is not notarized, so on first launch remove the quarantine flag:
               ```bash
               xattr -cr /Applications/TheArabicOCR.app
               ```
               (or right-click the app → **Open** → **Open**).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
