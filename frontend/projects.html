<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <script src="js/i18n/bootstrap.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n-document-title="title.projects">المشاريع — أداة مراجعة OCR</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/home.css">
</head>
<body class="home-page">

    <main class="home-main">
        <div class="page-title-row">
            <div style="display: flex; align-items: center; gap: 14px;">
                <button id="back-btn" class="btn-secondary" data-i18n-title="projects.backTitle" title="العودة للصفحة الرئيسية" data-icon="back" data-i18n="projects.back">العودة</button>
                <h1 style="margin: 0;" data-i18n="projects.title">المشاريع</h1>
            </div>
            
            <div style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap;">
                <input type="text" id="search-input" data-i18n-placeholder="projects.search" placeholder="بحث في المشاريع..." class="search-box">
                <button id="btn-new-project-top" class="btn-primary trigger-new-project" data-icon="plus" data-i18n="nav.newProject">مشروع جديد</button>
            </div>
        </div>

        <div style="display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap;" id="projects-filter-bar">
            <button class="btn-secondary active" data-filter="all" style="font-size: 13px; padding: 6px 14px; border-radius: var(--radius-full);">الكل (<span id="count-all">0</span>)</button>
            <button class="btn-secondary" data-filter="completed" style="font-size: 13px; padding: 6px 14px; border-radius: var(--radius-full);">مكتمل (<span id="count-completed">0</span>)</button>
            <button class="btn-secondary" data-filter="in_progress" style="font-size: 13px; padding: 6px 14px; border-radius: var(--radius-full);">قيد المراجعة (<span id="count-progress">0</span>)</button>
            <button class="btn-secondary" data-filter="new" style="font-size: 13px; padding: 6px 14px; border-radius: var(--radius-full);">جديد (<span id="count-new">0</span>)</button>
        </div>

        <div class="table-wrapper">
            <table id="projects-table">
                <thead>
                    <tr>
                        <th data-i18n="projects.name">العنوان</th>
                        <th data-i18n="projects.author">المؤلف</th>
                        <th data-i18n="projects.created">تاريخ الإنشاء</th>
                        <th data-i18n="projects.pages">الصفحات</th>
                        <th data-i18n="projects.progress">التقدم</th>
                        <th data-i18n="projects.actions">إجراءات</th>
                    </tr>
                </thead>
                <tbody id="projects-tbody">
                    <tr id="loading-row"><td colspan="6" style="text-align:center; color:#aaa; padding:40px;" data-i18n="projects.loading">جار التحميل...</td></tr>
                </tbody>
            </table>
        </div>
    </main>

    <script src="js/icons.js"></script>
    <script src="js/core/api.js"></script>
    <script src="js/core/utils.js"></script>
    <script src="js/core/events.js"></script>
    <script src="js/core/store.js"></script>
    <script src="js/components/modal.js"></script>
    <script src="js/components/notifications.js"></script>
    <script src="js/components/command-palette.js"></script>
    <script src="js/components/sidebar.js"></script>

    <script src="js/pages/settings.js"></script>
    <script src="js/i18n/locales/ar.js"></script>
    <script src="js/i18n/locales/en.js"></script>
    <script src="js/i18n/locales/de.js"></script>
    <script src="js/i18n/i18n.js"></script>
    <script src="js/pages/ui-shared.js"></script>
    <script src="js/pages/project-creator.js"></script>
    <script src="js/pages/projects.js"></script>
    <script src="js/apply-icons.js"></script>
</body>
</html>
