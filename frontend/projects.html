<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المشاريع — أداة مراجعة OCR</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/home.css">
</head>
<body class="home-page">

    <main class="home-main">
        <div class="page-title-row">
            <div style="display: flex; align-items: center; gap: 14px;">
                <button id="back-btn" class="btn-secondary" title="العودة للصفحة الرئيسية">⟵ العودة</button>
                <h1 style="margin: 0;">المشاريع</h1>
            </div>
            <input type="text" id="search-input" placeholder="بحث..." class="search-box">
        </div>

        <div class="table-wrapper">
            <table id="projects-table">
                <thead>
                    <tr>
                        <th>العنوان</th>
                        <th>المؤلف</th>
                        <th>تاريخ الإنشاء</th>
                        <th>الصفحات</th>
                        <th>التقدم</th>
                        <th>إجراءات</th>
                    </tr>
                </thead>
                <tbody id="projects-tbody">
                    <tr id="loading-row"><td colspan="6" style="text-align:center; color:#aaa; padding:40px;">جار التحميل...</td></tr>
                </tbody>
            </table>
        </div>
    </main>

    <script src="js/core/api.js"></script>
    <script src="js/core/utils.js"></script>
    <script src="js/core/events.js"></script>
    <script src="js/core/store.js"></script>
    <script src="js/components/modal.js"></script>
    <script src="js/components/notifications.js"></script>
    <script src="js/components/sidebar.js"></script>

    <script src="js/settings.js"></script>
    <script src="js/ui-shared.js"></script>
    <script src="js/project-creator.js"></script>
    <script src="js/pages/projects.js"></script>
    <!-- fallback -->
    <script src="js/projects.js"></script>
</body>
</html>
