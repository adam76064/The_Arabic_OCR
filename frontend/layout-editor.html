<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <script src="js/i18n/bootstrap.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n-document-title="title.layout">تخطيط الصفحة (Layout Editor) — أداة مراجعة OCR</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Layout editor modern studio styling with tokens */
        #layout-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            background: var(--color-bg);
            overflow: hidden;
            min-width: 0;
            color: var(--color-text);
        }
        
        .layout-toolbar {
            display: flex; gap: 10px; align-items: center; padding: 10px 18px; 
            background: var(--color-surface); border-bottom: 1px solid var(--color-border); box-shadow: var(--shadow-xs); z-index: 10;
            flex-shrink: 0;
        }
        
        .tool-group { display: flex; gap: 4px; border-inline-start: 1px solid var(--color-border); padding-inline-start: 12px; margin-inline-start: 4px; }
        
        .tool-btn {
            display: flex; align-items: center; gap: 6px; padding: 6px 12px; border: 1px solid var(--color-border-strong); 
            border-radius: var(--radius-md); background: var(--color-surface); cursor: pointer; font-size: var(--text-sm); font-weight: 600;
            transition: all var(--trans-fast); color: var(--color-text);
        }
        .tool-btn:hover { background: var(--color-surface-hover); border-color: var(--color-primary); }
        .active-tool { background: var(--color-primary-light) !important; border-color: var(--color-primary) !important; color: var(--color-primary); }
        .tool-btn.danger:hover { background: var(--color-danger-light); border-color: var(--color-danger); color: var(--color-danger); }
        .tool-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        
        #canvas-container { flex: 1; overflow: auto; position: relative; padding: 40px; display: flex; justify-content: center; align-items: flex-start; background: var(--color-canvas); }
        #canvas-wrapper { position: relative; box-shadow: var(--shadow-xl); background: var(--color-surface); }
        #page-image { display: block; max-width: none; user-select: none; }
        #layout-canvas { position: absolute; top: 0; left: 0; cursor: default; }
    </style>
</head>
<body>
    <div id="layout-main">
    <header class="layout-toolbar">
        <button id="btn-back" class="btn-secondary" data-icon="back" data-i18n="layout.back">رجوع</button>
        <button id="prev-page" class="btn-secondary" data-icon="prev" data-i18n="layout.previous">السابق</button>
        <span style="font-weight: bold; font-size: 15px; margin: 0 10px; color: #2c3e50;"><span data-i18n="layout.page">تخطيط صفحة</span> <span id="page-num-display">...</span></span>
        <button id="next-page" class="btn-secondary" data-icon="next" data-i18n="layout.next">التالي</button>
        
        <div class="tool-group">
            <button id="btn-undo" class="tool-btn" data-i18n-title="layout.undo" title="تراجع (Ctrl+Z)" data-icon="undo" disabled></button>
            <button id="btn-redo" class="tool-btn" data-i18n-title="layout.redo" title="إعادة (Ctrl+Y)" data-icon="redo" disabled></button>
        </div>

        <div class="tool-group">
            <button id="tool-select" class="tool-btn active-tool" data-i18n-title="layout.selectTitle" title="تحديد الكتل والتعديل الداخلي للجداول" data-icon="select" data-i18n="layout.select">تحديد</button>
            <button id="tool-move" class="tool-btn" data-i18n-title="layout.moveTitle" title="تحريك وتغيير حجم الكتل بالكامل" data-icon="move" data-i18n="layout.move">تحريك</button>
            <button id="tool-draw" class="tool-btn" data-i18n-title="layout.drawTitle" title="رسم كتلة نصية جديدة" data-icon="draw" data-i18n="layout.draw">رسم</button>
            <button id="tool-order" class="tool-btn" data-i18n-title="layout.orderTitle" title="انقر على الكتل بالتسلسل لترتيبها" data-icon="order" data-i18n="layout.order">ترتيب</button>
            <button id="tool-flowlines" class="tool-btn" title="إظهار/إخفاء خطوط تسلسل القراءة" data-icon="order">مسار القراءة</button>
        </div>

        <div class="tool-group">
            <button id="btn-merge" class="tool-btn" data-i18n-title="layout.mergeTitle" title="دمج الكتل المحددة" data-icon="merge" disabled data-i18n="layout.merge">دمج</button>
            <button id="btn-delete" class="tool-btn danger" data-i18n-title="layout.deleteTitle" title="حذف الكتل المحددة" data-icon="trash" disabled data-i18n="layout.delete">حذف</button>
        </div>

        <div style="flex: 1;"></div>
        <button id="btn-save" class="btn-success" data-icon="save" data-i18n="layout.save">حفظ التخطيط</button>
    </header>

    <main id="canvas-container">
        <div id="canvas-wrapper">
            <img id="page-image" src="" alt="Page Layout">
            <canvas id="layout-canvas"></canvas>
        </div>
    </main>
    </div>

    <script src="js/icons.js"></script>
    <script src="js/core/theme.js"></script>
    <script src="js/core/api.js"></script>
    <script src="js/core/utils.js"></script>
    <script src="js/core/events.js"></script>
    <script src="js/core/store.js"></script>
    <script src="js/components/modal.js"></script>
    <script src="js/components/notifications.js"></script>
    <script src="js/components/command-palette.js"></script>
    <script src="js/components/sidebar.js"></script>
    <script src="js/pages/settings.js"></script>
    <script src="js/i18n/locales/ar.js"></script>
    <script src="js/i18n/locales/en.js"></script>
    <script src="js/i18n/locales/de.js"></script>
    <script src="js/i18n/i18n.js"></script>
    <script src="js/pages/ui-shared.js"></script>
    <!-- Layout Editor modular -->
    <script src="js/pages/layout-editor/state.js"></script>
    <script src="js/pages/layout-editor/history.js"></script>
    <script src="js/pages/layout-editor/selection.js"></script>
    <script src="js/pages/layout-editor/table-tools.js"></script>
    <script src="js/pages/layout-editor/properties.js"></script>
    <script src="js/pages/layout-editor/canvas.js"></script>
    <script src="js/pages/layout-editor/toolbar.js"></script>
    <script src="js/pages/layout-editor/navigation.js"></script>
    <script src="js/pages/layout-editor/save.js"></script>
    <script src="js/pages/layout-editor/events.js"></script>
    <script src="js/pages/layout-editor/index.js"></script>
    <script src="js/pages/layout-editor.js"></script>
    <script src="js/apply-icons.js"></script>
</body>
</html>
