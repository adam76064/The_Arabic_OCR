<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <script src="js/i18n/bootstrap.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n-document-title="title.layout">تخطيط الصفحة (Layout Editor) — أداة مراجعة OCR</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Layout editor modern studio styling with tokens */
        #layout-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            background: var(--color-bg);
            overflow: hidden;
            min-width: 0;
            color: var(--color-text);
        }
        
        .layout-toolbar {
            display: flex; gap: 10px; align-items: center; padding: 10px 18px; 
            background: var(--color-surface); border-bottom: 1px solid var(--color-border); box-shadow: var(--shadow-xs); z-index: 10;
            flex-shrink: 0;
        }
        
        .tool-group { display: flex; gap: 4px; border-inline-start: 1px solid var(--color-border); padding-inline-start: 12px; margin-inline-start: 4px; }
        
        .tool-btn {
            display: flex; align-items: center; gap: 6px; padding: 6px 12px; border: 1px solid var(--color-border-strong); 
            border-radius: var(--radius-md); background: var(--color-surface); cursor: pointer; font-size: var(--text-sm); font-weight: 600;
            transition: background-color var(--trans-fast), border-color var(--trans-fast), color var(--trans-fast); color: var(--color-text);
        }
        .tool-btn:hover { background: var(--color-surface-hover); border-color: var(--color-primary); }
        .active-tool { background: var(--color-primary-light) !important; border-color: var(--color-primary) !important; color: var(--color-primary); }
        .tool-btn.danger:hover { background: var(--color-danger-light); border-color: var(--color-danger); color: var(--color-danger); }
        .tool-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        
        #canvas-container { flex: 1; overflow: auto; position: relative; padding: 40px; display: flex; justify-content: center; align-items: flex-start; background: var(--color-canvas); direction: ltr; }
        #canvas-wrapper { position: relative; box-shadow: var(--shadow-xl); background: var(--color-surface); }
        #page-image { display: block; max-width: none; user-select: none; }
        #layout-canvas { position: absolute; top: 0; left: 0; cursor: default; }
    </style>
</head>
<body>
    <div id="layout-main">
    <header class="layout-toolbar-header" style="background: var(--color-surface); border-bottom: 1px solid var(--color-border); box-shadow: var(--shadow-xs); z-index: 10; flex-shrink: 0; display: flex; flex-direction: column;">
        <!-- Band 1: Page Navigation, Undo/Redo & Save Action -->
        <div class="layout-toolbar layout-toolbar-nav" style="display: flex; gap: 10px; align-items: center; padding: 7px 18px; border-bottom: 1px solid var(--color-border);">
            <button id="btn-back" class="btn-secondary" data-icon="back" data-i18n="layout.back">رجوع</button>
            <button id="prev-page" class="btn-secondary" data-icon="prev" data-i18n="layout.previous">السابق</button>
            <span style="font-weight: bold; font-size: 15px; margin: 0 10px; color: var(--color-text);"><span data-i18n="layout.page">تخطيط صفحة</span> <span id="page-num-display">...</span></span>
            <button id="next-page" class="btn-secondary" data-icon="next" data-i18n="layout.next">التالي</button>
            
            <div class="tool-group">
                <button id="btn-undo" class="tool-btn" data-i18n-title="layout.undo" title="تراجع (Ctrl+Z)" data-icon="undo" disabled></button>
                <button id="btn-redo" class="tool-btn" data-i18n-title="layout.redo" title="إعادة (Ctrl+Y)" data-icon="redo" disabled></button>
            </div>

            <div style="flex: 1;"></div>
            <button id="btn-save" class="btn-success" data-icon="save" data-i18n="layout.save" style="font-size: 13.5px; font-weight: 700; padding: 6px 16px;">حفظ التخطيط</button>
        </div>

        <!-- Band 2: Canvas Tools, Block Operations & History -->
        <div class="layout-toolbar layout-toolbar-tools" style="display: flex; gap: 10px; align-items: center; padding: 6px 18px; background: var(--color-bg-alt);">
            <div class="tool-group" style="border: none; padding: 0; margin: 0;">
                <button id="tool-select" class="tool-btn active-tool" data-i18n-title="layout.selectTitle" title="تحديد الكتل والتعديل الداخلي للجداول" data-icon="select" data-i18n="layout.select">تحديد</button>
                <button id="tool-move" class="tool-btn" data-i18n-title="layout.moveTitle" title="تحريك وتغيير حجم الكتل بالكامل" data-icon="move" data-i18n="layout.move">تحريك</button>
                <button id="tool-draw" class="tool-btn" data-i18n-title="layout.drawTitle" title="رسم كتلة نصية جديدة" data-icon="draw" data-i18n="layout.draw">رسم</button>
                <button id="tool-order" class="tool-btn" data-i18n-title="layout.orderTitle" title="انقر على الكتل بالتسلسل لترتيبها" data-icon="order" data-i18n="layout.order">ترتيب</button>
                <button id="tool-flowlines" class="tool-btn" title="إظهار/إخفاء خطوط تسلسل القراءة" data-i18n-title="layout.flowlinesTitle" data-icon="order" data-i18n="layout.flowlines">مسار القراءة</button>
            </div>

            <div class="tool-group">
                <button id="btn-merge" class="tool-btn" data-i18n-title="layout.mergeTitle" title="دمج الكتل المحددة" data-icon="merge" disabled data-i18n="layout.merge">دمج</button>
                <button id="btn-delete" class="tool-btn danger" data-i18n-title="layout.deleteTitle" title="حذف الكتل المحددة" data-icon="trash" disabled data-i18n="layout.delete">حذف</button>
                <button id="btn-toggle-history" class="tool-btn" title="سجل العمليات" data-icon="order">السجل</button>
            </div>
        </div>
    </header>

    <!-- Multi-select Count Badge (UI-LE2) -->
    <div id="layout-selection-badge" class="hidden" style="position: fixed; top: 96px; inset-inline-end: 20px; z-index: 50; background: var(--color-primary); color: #fff; padding: 6px 14px; border-radius: var(--radius-full); font-size: 13px; font-weight: 700; box-shadow: var(--shadow-md); pointer-events: none;">
        <span id="layout-selection-count">0</span> كتل محددة
    </div>

    <!-- History Panel (UI-LE3) -->
    <div id="layout-history-panel" class="hidden" style="position: fixed; top: 96px; inset-inline-end: 20px; z-index: 60; background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-md); box-shadow: var(--shadow-xl); width: 220px; max-height: 320px; display: flex; flex-direction: column;">
        <div style="padding: 10px 14px; border-bottom: 1px solid var(--color-border); font-weight: 700; font-size: 13px; display: flex; justify-content: space-between; align-items: center; color: var(--color-text);">
            <span>سجل العمليات (History)</span>
            <button id="close-history-btn" style="background:none; border:none; cursor:pointer; font-size:13px; color:var(--color-text-muted);">✕</button>
        </div>
        <div id="layout-history-list" style="overflow-y: auto; padding: 6px 0; max-height: 260px;"></div>
    </div>

    <!-- Block Type Color Legend (UI-LE4) -->
    <div id="layout-color-legend" style="position: fixed; bottom: 18px; inset-inline-start: 20px; z-index: 50; background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-md); padding: 8px 12px; box-shadow: var(--shadow-sm); display: flex; gap: 10px; align-items: center; font-size: 11.5px; font-weight: 600; flex-wrap: wrap; color: var(--color-text);">
        <div style="display:flex; align-items:center; gap:4px;"><span style="width:10px; height:10px; border-radius:2px; background:#7c3aed;"></span><span>عنوان</span></div>
        <div style="display:flex; align-items:center; gap:4px;"><span style="width:10px; height:10px; border-radius:2px; background:#2563eb;"></span><span>نص</span></div>
        <div style="display:flex; align-items:center; gap:4px;"><span style="width:10px; height:10px; border-radius:2px; background:#0284c7;"></span><span>جدول</span></div>
        <div style="display:flex; align-items:center; gap:4px;"><span style="width:10px; height:10px; border-radius:2px; background:#64748b;"></span><span>حاشية</span></div>
        <div style="display:flex; align-items:center; gap:4px;"><span style="width:10px; height:10px; border-radius:2px; background:#059669;"></span><span>صورة</span></div>
        <div style="display:flex; align-items:center; gap:4px;"><span style="width:10px; height:10px; border-radius:2px; background:#d97706;"></span><span>شعر</span></div>
    </div>

    <!-- Canvas Minimap Panel (UI-LE1) -->
    <div id="layout-minimap-panel" style="position: fixed; bottom: 18px; inset-inline-end: 20px; z-index: 50; background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-md); padding: 6px; box-shadow: var(--shadow-md); width: 140px; height: 180px; display: flex; flex-direction: column;">
        <div style="font-size: 10px; font-weight: 700; color: var(--color-text-muted); margin-bottom: 4px; display: flex; justify-content: space-between;">
            <span>خريطة مصغرة</span>
        </div>
        <div id="minimap-viewport" style="position: relative; flex: 1; background: var(--color-bg-alt); border-radius: 4px; overflow: hidden; cursor: crosshair;">
            <canvas id="layout-minimap-canvas" style="width: 100%; height: 100%; display: block;"></canvas>
            <div id="minimap-view-rect" style="position: absolute; border: 1.5px solid var(--color-primary); background: rgba(15, 118, 110, 0.15); pointer-events: none;"></div>
        </div>
    </div>

    <main id="canvas-container">
        <div id="canvas-wrapper">
            <img id="page-image" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg'/%3E" alt="Page Layout">
            <canvas id="layout-canvas"></canvas>
        </div>
    </main>
    </div>

    <script src="js/icons.js"></script>
    <script src="js/i18n/locales/ar.js"></script>
    <script src="js/i18n/locales/en.js"></script>
    <script src="js/i18n/locales/de.js"></script>
    <script src="js/i18n/i18n.js"></script>
    <script src="js/core/theme.js"></script>
    <script src="js/core/api.js"></script>
    <script src="js/core/utils.js"></script>
    <script src="js/core/events.js"></script>
    <script src="js/core/store.js"></script>
    <script src="js/components/modal.js"></script>
    <script src="js/components/notifications.js"></script>
    <script src="js/components/command-palette.js"></script>
    <script src="js/components/sidebar.js"></script>
    <script src="js/pages/settings.js"></script>
    <script src="js/pages/ui-shared.js"></script>
    <!-- Layout Editor modular -->
    <script src="js/pages/layout-editor/state.js"></script>
    <script src="js/pages/layout-editor/history.js"></script>
    <script src="js/pages/layout-editor/selection.js"></script>
    <script src="js/pages/layout-editor/table-tools.js"></script>
    <script src="js/pages/layout-editor/properties.js"></script>
    <script src="js/pages/layout-editor/canvas.js"></script>
    <script src="js/pages/layout-editor/toolbar.js"></script>
    <script src="js/pages/layout-editor/navigation.js"></script>
    <script src="js/pages/layout-editor/save.js"></script>
    <script src="js/pages/layout-editor/events.js"></script>
    <script src="js/pages/layout-editor/index.js"></script>
    <script src="js/pages/layout-editor.js"></script>
    <script src="js/apply-icons.js"></script>
</body>
</html>
