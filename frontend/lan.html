<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <script src="js/i18n/bootstrap.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n-document-title="title.lan">مشاريع الشبكة المحلية — أداة مراجعة OCR</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/home.css">
</head>
<body class="home-page">

    <main class="home-main">
        <div class="page-title-row">
            <h1 data-i18n="lan.title">مشاريع الشبكة المحلية</h1>
            <button id="rescan-btn" class="btn-primary" data-icon="scan" data-i18n="lan.rescan">إعادة البحث</button>
        </div>
        <div id="lan-status" style="margin-bottom:16px; color:var(--color-text-muted); font-size:14px;" data-i18n="lan.searching">جارٍ البحث عن مشاريع على الشبكة...</div>
        <div id="lan-results" class="home-cards"></div>
    </main>

    <div class="modal hidden" id="lan-join-modal">
        <div class="modal-overlay"></div>
        <div class="modal-box">
            <div class="modal-header"><h3 data-i18n="lan.join">الانضمام للمشروع</h3><button class="modal-close" id="lan-join-close">✕</button></div>
            <div class="modal-body">
                <div class="form-group">
                    <label data-i18n="lan.password">كلمة المرور</label>
                    <input type="password" id="lan-join-password">
                </div>
                <div class="form-actions">
                    <button id="lan-join-confirm" class="btn-success" data-i18n="lan.confirmJoin">انضمام</button>
                </div>
            </div>
        </div>
    </div>

    <script src="js/icons.js"></script>
    <script src="js/core/theme.js"></script>
    <script src="js/core/api.js"></script>
    <script src="js/core/utils.js"></script>
    <script src="js/core/events.js"></script>
    <script src="js/core/store.js"></script>
    <script src="js/components/modal.js"></script>
    <script src="js/components/notifications.js"></script>
    <script src="js/components/command-palette.js"></script>
    <script src="js/components/sidebar.js"></script>
    <script src="js/pages/settings.js"></script>
    <script src="js/i18n/locales/ar.js"></script>
    <script src="js/i18n/locales/en.js"></script>
    <script src="js/i18n/locales/de.js"></script>
    <script src="js/i18n/i18n.js"></script>
    <script src="js/pages/lan.js"></script>
    <script src="js/apply-icons.js"></script>
</body>
</html>
