<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مشاريع الشبكة المحلية — أداة مراجعة OCR</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/home.css">
</head>
<body class="home-page">

    <main class="home-main">
        <div class="page-title-row">
            <h1>مشاريع الشبكة المحلية</h1>
            <button id="rescan-btn" class="btn-primary">🔄 إعادة البحث</button>
        </div>
        <div id="lan-status" style="margin-bottom:16px; color:#888; font-size:14px;">جارٍ البحث عن مشاريع على الشبكة...</div>
        <div id="lan-results" class="home-cards"></div>
    </main>

    <div class="modal hidden" id="lan-join-modal">
        <div class="modal-overlay"></div>
        <div class="modal-box">
            <div class="modal-header"><h3>الانضمام للمشروع</h3><button class="modal-close" id="lan-join-close">✕</button></div>
            <div class="modal-body">
                <div class="form-group">
                    <label>كلمة المرور</label>
                    <input type="password" id="lan-join-password">
                </div>
                <div class="form-actions">
                    <button id="lan-join-confirm" class="btn-success">انضمام</button>
                </div>
            </div>
        </div>
    </div>

    <script src="js/settings.js"></script>
    <script src="js/lan.js"></script>
    <script src="js/sidebar.js"></script>
</body>
</html>
